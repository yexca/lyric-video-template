<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web video template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Dela+Gothic+One&family=Cormorant+Garamond:ital,wght@1,600&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- lang="ja" on the stage: the canvas picks fallback glyphs by it, whatever language the player UI is shown in -->
<div id="stage" lang="ja"><canvas id="cv" width="1920" height="1080"></canvas></div>

<div id="start">
  <div class="inner">
    <div class="t1"></div>
    <div class="t2"></div>
    <button id="play0" disabled data-i18n>Loading…</button>
    <div class="keys" data-i18n>Space play / pause · ←/→ 5 s (Shift 1 s) · 1–9 sections · L lyrics · F full screen · H hide the controls · D debug info</div>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="ui">
  <div id="bar"><div class="track"></div><div class="fill"></div><div class="knob"></div><div class="tip"></div></div>
  <div id="row">
    <button id="pp" aria-label="Play / pause" data-i18n="aria-label"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path id="ppi" d="M7 5v14l12-7z"/></svg></button>
    <span id="time">0:00 / 0:00</span>
    <span id="scene"></span>
    <button id="lyr" class="pill" type="button" aria-pressed="true" title="Show lyrics (L)" data-i18n="title">Lyrics ON</button>
    <span class="keys">Space · ←/→ · 1–9 · L · F · H</span>
    <button id="fs" aria-label="Full screen" data-i18n="aria-label"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>

<audio id="audio" preload="auto"></audio>
<!-- The player's own text (start screen, controls, start-up notes) is written in English; other languages are
     dictionaries (lang.<code>.js, mechanism in tools/i18n.js). What is drawn on the canvas is content: never translated -->
<script src="../tools/i18n.js"></script>
<script src="lang.zh-cn.js"></script>
<!-- Data (generated by the tools, loaded as scripts). analysis.js lives in data/ and is computed from the audio;
     lyrics.js is a snapshot of the one in lyrics/ -->
<script src="../data/derived/analysis.js" data-optional="1"></script>
<script src="js/lyrics.js"></script>
<!-- Engine -->
<script src="js/core.js"></script>
<script src="js/assets.js"></script>
<script src="js/fx.js"></script>
<script src="js/type.js"></script>
<!-- Content: the storyboard (when it grows it can be split into several files, all loaded before main.js) -->
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
