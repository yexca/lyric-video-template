<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n>Image overview</title>
<style>
  :root { --bg: #12151b; --panel: #1b2029; --line: #333c4c; --ink: #eef0f4; --dim: #9aa4b5; --acc: #ffb454; --add: #58c98a; --del: #ef6a6a; --chg: #6fb0ff; }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  html.boxed { overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  h1 { font-size: 17px; margin: 0 8px 0 0; }
  select, button, input { font: inherit; color: var(--ink); background: #242b36; border: 1px solid #485266; border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  nav { display: flex; gap: 4px; }
  nav button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #1a1205; font-weight: 700; }
  .ctl { display: none; align-items: center; gap: 8px; }
  .ctl.on { display: flex; }
  #stat { color: var(--acc); margin-left: auto; }
  #count { color: var(--dim); }
  main { padding: 6px 18px 60px; }
  h2 { font-size: 14px; color: var(--dim); font-weight: 600; margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  h2 b { color: var(--ink); font-size: 15px; margin-right: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 200px), 1fr)); gap: 12px; }
  .tile { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tile img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: repeating-conic-gradient(#20252e 0 25%, #262c37 0 50%) 0 0 / 20px 20px; cursor: zoom-in; }
  .tile .no { position: absolute; left: 6px; top: 6px; background: rgba(0, 0, 0, .78); color: var(--acc); font: 800 20px/1 system-ui; padding: 6px 9px; border-radius: 6px; cursor: copy; border: 0; }
  .tile .no small { font-size: 12px; color: #fff; margin-left: 4px; font-weight: 600; }
  .tile .cap { padding: 6px 9px; font-size: 12px; color: var(--dim); word-break: break-all; }
  .tile .cap b { color: var(--ink); font-weight: 600; }
  .tile .more, .head .more, h2 .more { background: rgba(0, 0, 0, .78); color: #fff; font-size: 12px; line-height: 1; padding: 6px 8px; border-radius: 6px; border: 0; }
  .tile .more { position: absolute; right: 6px; top: 6px; }
  .head .more, h2 .more { margin: 6px 0 0; background: #242b36; border: 1px solid #485266; }
  h2 .more { margin: 0 0 0 10px; }
  .more:hover { color: var(--acc); }
  .tile.cur { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc); }
  .times { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; vertical-align: middle; }
  button.t { font: 600 12px/1 ui-monospace, Consolas, monospace; padding: 4px 6px; border-radius: 4px; color: var(--acc); background: #2a2417; border-color: #6b5326; }
  button.t:hover { background: var(--acc); color: #1a1205; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 9px 8px; }
  .acts:empty { display: none; }
  button.use { font-size: 12px; line-height: 1; padding: 6px 10px; color: var(--add); border-color: var(--add); background: transparent; }
  button.use:hover { background: var(--add); color: #06210f; }
  button.use:disabled { opacity: .4; cursor: progress; }
  .dhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin: 16px 0 0; }
  .dhead b { font: 800 28px/1 system-ui; color: var(--acc); }
  .dhead span { color: var(--dim); }
  .tile.miss img { visibility: hidden; }
  .tile.miss::after { content: var(--t-miss); position: absolute; inset: 0 0 40px; display: grid; place-items: center; color: var(--del); }
  .tile.fail img { opacity: .12; cursor: pointer; }
  .tile.fail::after { content: var(--t-fail); position: absolute; inset: 0 0 40px; display: grid; place-items: center; color: var(--del); pointer-events: none; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-right: 4px; border: 1px solid currentColor; }
  .tag.add { color: var(--add); } .tag.del { color: var(--del); } .tag.chg { color: var(--chg); } .tag.use { color: var(--dim); }
  .row { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 12px; align-items: start; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .row .head { font: 800 22px/1.2 system-ui; color: var(--acc); }
  .row .head div { font: 12px/1.4 system-ui; color: var(--dim); word-break: break-all; margin-top: 4px; }
  .row .none { aspect-ratio: 1; display: grid; place-items: center; color: var(--dim); border: 1px dashed var(--line); border-radius: 8px; }
  .revs { display: flex; flex-wrap: wrap; gap: 12px; }
  .revs .tile, .revs .none { width: var(--tile, 200px); }
  .row.pick { grid-template-columns: 90px max-content 1fr; }
  .revs.used { flex-wrap: nowrap; padding-right: 12px; border-right: 1px solid var(--line); }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; white-space: pre-line; }
  .hint { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
  #box, #vid { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .93); display: none; grid-template-rows: auto 1fr; }
  #vid { z-index: 25; background: #000; }
  #box.on, #vid.on { display: grid; }
  .bar { padding: 10px 16px; display: flex; gap: 14px; align-items: center; }
  .bar b { color: var(--acc); font-size: 20px; }
  .bar span, .bar a { color: var(--dim); }
  .bar .acts { padding: 0; }
  #box img { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
  #vid iframe { width: 100%; height: 100%; border: 0; min-height: 0; background: #000; }
  .probe { position: fixed; left: -4000px; top: 0; width: 1920px; height: 1080px; border: 0; visibility: hidden; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #000; border: 1px solid var(--line); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; display: flex; gap: 10px; align-items: center; }
  #toast.on { opacity: 1; }
  #toast.on.act { pointer-events: auto; }
  #toast button { padding: 3px 10px; color: var(--acc); border-color: var(--acc); background: transparent; }
</style>
</head>
<body>
<header>
  <h1 id="h1" data-i18n>Image overview</h1>
  <nav>
    <button data-view="version" aria-pressed="true" data-i18n>Images</button>
    <button data-view="cand" aria-pressed="false" data-i18n>Candidates</button>
    <button data-view="diff" aria-pressed="false" data-i18n>Compare versions</button>
  </nav>
  <span class="ctl" data-for="version cand one"><span data-i18n>Version</span> <select id="ver"></select></span>
  <span class="ctl" data-for="version cand"><span data-i18n>Sort</span> <select id="sort"><option value="time" data-i18n>Order of appearance</option><option value="group" data-i18n>Group / number</option></select></span>
  <span class="ctl" data-for="cand"><label><input type="checkbox" id="onlyNew"> <span data-i18n>Only new / changed</span></label></span>
  <span class="ctl" data-for="diff"><select id="va"></select> → <select id="vb"></select> <label><input type="checkbox" id="onlyChg" checked> <span data-i18n>Only differences</span></label></span>
  <input id="q" type="search" placeholder="Filter: number / key / group" data-i18n="placeholder" size="18">
  <label><span data-i18n>Size</span> <input id="size" type="range" min="120" max="520" step="20" value="200"></label>
  <span id="stat"></span>
  <span id="count"></span>
  <select data-i18n-lang aria-label="Language"></select>
</header>
<main id="main"></main>
<div id="box"><div class="bar"><b id="boxNo"></b><span id="boxCap"></span><span class="acts" id="boxUse"></span><span style="margin-left:auto" data-i18n>←/→ previous / next · Esc close · click the number to copy it</span></div><img id="boxImg" alt=""></div>
<div id="vid"><div class="bar"><b id="vidNo"></b><span data-i18n>Click the picture to play / pause · ←/→ 5 s back / forward</span><a id="vidOpen" target="_blank" rel="noopener" style="margin-left:auto" data-i18n>Open in a new tab ↗</a><button data-vidclose data-i18n>Close (Esc)</button></div><iframe id="vidFrame" title="Video" data-i18n="title" allow="autoplay; fullscreen"></iframe></div>
<div id="toast"></div>
<script src="../tools/i18n.js"></script>
<script src="lang.zh-cn.js"></script>
<script>
'use strict';
/* Image overview. Numbers, revisions and each version's images all come from pics.json and <version>/images.json (maintained by pic-tool/pic.py).
 * When talking about images, just say "#37" (the number), "#37 r2" (revision 2) or "candidate hero/03" (data/candidates/hero/03.png). Clicking the number on an image copies that wording.
 *
 * "Version" is a filter: pick a version = only the images that version uses; pick "All versions" = everything in the image pool (every revision of every image / every candidate folder).
 *   Images (pic-tool/): the images this version uses, ordered by when each first appears in the song (grouped by section); under each image are the times of all its appearances — click one to open this version's video here at that part.
 *     All versions (pic-tool/#pool): one row per registered image, listing every revision and which versions use it.
 *   Candidates (pic-tool/#cand): one row per image of this version — the revision in use (with the one the previous version used beside it, if it changed) + old revisions not in use + every candidate in data/candidates/<key>/.
 *     With "Only new / changed" ticked (pic-tool/#pick) = only the images that are new or changed since the previous version, for verifying after a round of picking. All versions: every folder in data/candidates/.
 *   Compare versions (pic-tool/#diff): two versions compared image by image.
 * "Candidates N" at the top right of an image: opens that image's own page (pic-tool/#37) — all its revisions + all its candidates, marking which one the selected version uses and which candidate each revision came from.
 *
 * Appearance times are measured: the version's video page is opened in an invisible iframe, a frame is drawn every 0.1 s for the whole song, and the images actually drawn on screen in each frame are recorded (probe()).
 *   The result is stored in data/derived/usage/<version>.json; after that version's storyboard files change, it is re-measured automatically the next time this page is opened (a few seconds).
 * "Use this": makes the selected version use this revision / this candidate (a candidate is first added to the image pool as a new revision; data/img/ stays append-only as ever) — the same as pic.py use / pic.py add,
 *   and what changes is <version>/images.json and pics.json. Reload the video page and the new image is there; after a swap, the toast at the bottom offers "Undo" and "Watch at …".
 *   When the new image's aspect ratio or head position differs from the old one's, the parameters measured for the storyboard (head / fx / fy in assets.js) do not follow; change them separately.
 * The tiles show thumbnails (/__thumb in tools/serve.py, stored in data/thumbs/); the original is loaded only when a tile is opened.
 * All UI text is written in English (the English is the source string and also the dictionary lookup key); the Chinese is in lang.zh-cn.js (see tools/i18n.js for how it works). When you add or reword UI text, add or update the entry there too. */
I18N.apply();
for (const [k, s] of [['--t-miss', tr('File is not in data/img')], ['--t-fail', tr('Failed to load · click to retry')]]) document.documentElement.style.setProperty(k, JSON.stringify(s));
const $ = s => document.querySelector(s);
const IMG = 'data/img/', CAND = 'data/candidates/';      // relative to the workspace root
const ALL = '*';                                          // "All versions"
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const get = async (url, fallback) => { try { const r = await fetch(url, { cache: 'no-store' }); return r.ok ? await r.json() : fallback; } catch { return fallback; } };
const post = async (url, body) => { try { return await (await fetch(url, { method: 'POST', body: JSON.stringify(body) })).json(); } catch (e) { return { ok: false, msg: String(e) }; } };
let proj, reg, pool = new Map(), cands = [], candBy = new Map(), man = {}, shown = [], boxAt = 0, depth = 0, TW = 0, later = false;
const usage = {};                 // version → measured appearance times { keys: { key: [[start, end], …] }, sections: [[time, section name], …] }; null = not measured yet
// What is being viewed now. All of it (scroll position included) is kept in the browser history: going back, "← Back" and reloading all return to the same page and position
const S = { view: 'version', one: 0, ver: '', va: '', vb: '', onlyChg: true, onlyNew: false, sort: 'time', q: '' };

// acts: [[button label, what clicking it does], …]. A toast with buttons stays up a little longer
function toast(s, acts = []) {
  const t = $('#toast'); t.textContent = s; toast.acts = acts;
  acts.forEach(([label], i) => { const b = document.createElement('button'); b.textContent = label; b.dataset.act = i; t.append(b); });
  t.classList.toggle('act', acts.length > 0); t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), acts.length ? 9000 : 1400);
}
const stat = s => { $('#stat').textContent = s; };
const urlOf = rel => '../' + rel.split('/').map(encodeURIComponent).join('/');
// Thumbnails for the tiles: the width is the smallest of the sizes the server offers that is big enough; when the server makes no thumbnails (Pillow not installed) it is the original
const thumbW = () => { const need = $('#size').value * 1.5 * devicePixelRatio; return proj.thumbs.find(w => w >= need) || proj.thumbs.at(-1) || 0; };
const thumbOf = (rel, m) => TW ? `/__thumb?f=${encodeURIComponent(rel)}&w=${TW}&m=${m || 0}` : urlOf(rel);
// The tile for one image. rel = path relative to the workspace, m = the file's modification time; label = the wording copied when the number badge is clicked.
// o: small = small text on the number badge, cap = caption under the image, cls, badge = text shown on the number badge (by default the first part of label, e.g. "#37"), more = the button at the top right, use = the "Use this" buttons
function tile(rel, m, label, { small = '', cap = '', cls = '', badge = label.split(' ')[0], more = '', use = '' } = {}) {
  const i = shown.push({ rel, m, label, cap, use }) - 1;
  return `<div class="tile ${cls}"><img loading="lazy" decoding="async" src="${esc(thumbOf(rel, m))}" data-i="${i}" alt="${esc(label)}">
    <button class="no" data-copy="${esc(label)}" title="${esc(tr('Click to copy'))}">${esc(badge)}${small ? `<small>${esc(small)}</small>` : ''}</button>${more}<div class="cap">${cap}</div><div class="acts">${use}</div></div>`;
}
const poolTile = (file, label, o = {}) => tile(IMG + file, pool.get(file), label, { ...o, cls: (pool.has(file) ? '' : 'miss ') + (o.cls || '') });
const candName = f => f.path.replace(/\.[^.]+$/, '');
const candTile = (f, o = {}) => tile(CAND + f.path, f.mtime, tr('candidate {0}', candName(f)), { badge: candName(f).split('/').pop(), ...o });
// The candidates of one image (by key) in data/candidates/<key>/; the "Candidates N" button = open that image's own page
const candsOf = key => candBy.get(key) || [];
const fromName = from => { const s = from.replace(/\.[^.\/]+$/, ''); return s.startsWith(CAND) ? tr('candidate {0}', s.slice(CAND.length)) : s; };      // how a revision's source (from in pics.json) is displayed
const moreBtn = (no, text) => `<button class="more" data-one="${no}" title="${esc(tr('All revisions and candidates of this image'))}">${text || tr('Candidates {0}', candsOf(picOf(no).key).length)}</button>`;
const picOf = no => reg.pics.find(p => p.no === no) || { no, key: '?', group: '', revs: [] };
const match = (p, q) => !q || [`#${p.no}`, String(p.no), p.key, p.group || ''].some(s => s.toLowerCase().includes(q));
const usedBy = (no, rev) => proj.all.filter(v => (man[v] || []).some(it => it.no === no && it.rev === rev));
const itemTile = (it, { extra = '', cls = '', use = '' } = {}) => poolTile(it.file, `#${it.no} r${it.rev}`,
  { small: it.rev > 1 ? 'r' + it.rev : '', cap: `<b>${esc(it.key)}</b>${it.as ? ' → ' + esc(it.as) : ''} ${extra}`, cls, more: moreBtn(it.no), use });
const noItems = (v, q) => `<div class="empty">${q ? tr('{0} has no images registered yet (or nothing matches the filter).', v) : tr('{0} has no images registered yet.', v)}\npython pic-tool/pic.py add ${tr('&lt;image file&gt;')} --to ${v}</div>`;

/* ---------- Appearance times ---------- */
const clock = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
const nameOf = it => it.as || it.key;                    // the name the storyboard uses for this image
// The spans [start, end] during which a name is on screen in this version (spans less than 1 s apart count as one appearance). null when not measured yet
function spans(v, name) {
  const u = usage[v], out = [];
  if (!u) return null;
  for (const [a, b] of u.keys[name] || []) { const last = out.at(-1); if (last && a - last[1] < 1) last[1] = b; else out.push([a, b]); }
  return out;
}
const first = (v, name) => { const s = spans(v, name); return s && s.length ? s[0][0] : Infinity; };
const peek = ([a, b]) => Math.min(a + .6, b);            // where to stop when showing this span: right when it appears the image is often still coming in, so go a little further
// The row of times under an image: clicking one = open this version's video here, stopped at that part
function times(v, it) {
  const s = spans(v, nameOf(it));
  if (!s) return '';
  if (!s.length) return `<span class="tag del">${tr('Never on screen')}</span>`;
  return `<span class="times">${s.length > 1 ? `<span class="tag chg">${tr('on screen {0}×', s.length)}</span>` : ''}${s.map(x =>
    `<button class="t" data-t="${peek(x).toFixed(2)}" data-v="${esc(v)}" title="${tr('{0} – {1} · click to watch this part', clock(x[0]), clock(x[1]))}">${clock(x[0])}</button>`).join('')}</span>`;
}
// Sorted by first appearance and grouped by section: [[section heading, [item, …]], …], with the ones that never appear at the end. at(x) = when this item first appears
function bySection(v, list, at) {
  const secs = (usage[v].sections.length ? usage[v].sections : [[0, '']]).map(([t, name]) => ({ t, name, list: [] })), none = [];
  for (const x of [...list].sort((a, b) => (at(a) - at(b)) || 0)) {
    const t = at(x); let i = 0;
    if (t === Infinity) { none.push(x); continue; }
    while (i + 1 < secs.length && secs[i + 1].t <= t + .05) i++;
    secs[i].list.push(x);
  }
  return [...secs.filter(s => s.list.length).map(s => [`<b>${esc(s.name)}</b>${tr('from {0}', clock(s.t))}`, s.list]), ...(none.length ? [[`<b>${tr('Never on screen')}</b>${tr('registered in this version, but never drawn anywhere in the song')}`, none]] : [])];
}
const timed = v => S.sort === 'time' && !!usage[v];
const waitNote = v => S.sort === 'time' && !usage[v] ? `<div class="hint">${tr('Still measuring when each image appears; the list is re-sorted by order of appearance once that is done.')}</div>` : '';

/* Measure when each image of a version appears: open the version's video page in an invisible iframe, draw a frame every STEP seconds for the whole song,
 * and record the images actually drawn on screen in each frame (transparent ones and ones entirely off screen don't count). What is recorded is the name the storyboard uses (an alias counts as itself), so swapping an image needs no re-measuring. */
const STEP = .1;
async function probe(v, sig) {
  const f = document.createElement('iframe'), loaded = new Promise((res, rej) => { f.onload = res; f.onerror = rej; });
  f.className = 'probe'; f.src = `../${v}/index.html?export`;
  stat(tr('{0}: loading the video page to measure when each image appears…', v));
  document.body.append(f);
  try {
    await loaded;
    const w = f.contentWindow;
    await w.MV.ready;
    const IMGS = w.eval('IMG'), owner = new Map(), seen = new Set(), P = w.CanvasRenderingContext2D.prototype, draw = P.drawImage;
    for (const k in IMGS) for (const im of [IMGS[k].img, ...(IMGS[k].mips || [])]) if (im) owner.set(im, k);
    if (typeof w.duotone === 'function') {                // a duotone image is drawn from another canvas: record which key it belongs to
      const duo = w.duotone;
      w.duotone = function (key) { const cv = duo.apply(this, arguments); if (cv) owner.set(cv, key); return cv; };
    }
    const onScreen = (g, a) => {                          // whether the place it is drawn at (the trailing arguments of drawImage), once transformed, intersects the canvas
      const [x, y, dw, dh] = a.length >= 8 ? a.slice(4) : a, m = g.getTransform(), xs = [], ys = [];
      if (dw == null) return true;
      for (const [px, py] of [[x, y], [x + dw, y], [x, y + dh], [x + dw, y + dh]]) { xs.push(m.a * px + m.c * py + m.e); ys.push(m.b * px + m.d * py + m.f); }
      return Math.max(...xs) > 0 && Math.max(...ys) > 0 && Math.min(...xs) < g.canvas.width && Math.min(...ys) < g.canvas.height;
    };
    P.drawImage = function (src, ...a) {
      const k = owner.get(src);
      if (k && !seen.has(k) && this.globalAlpha > .02 && onScreen(this, a)) seen.add(k);
      return draw.call(this, src, ...a);
    };
    const D = w.MV.duration, n = Math.ceil(D / STEP), keys = {}, r2 = x => Math.round(x * 100) / 100;
    let tick = performance.now();
    for (let i = 0; i <= n; i++) {
      const t = r2(Math.min(i * STEP, D - .01));
      seen.clear(); w.MV.frame(t);
      for (const k of seen) { const s = keys[k] || (keys[k] = []), last = s.at(-1); if (last && t - last[1] <= STEP * 1.5) last[1] = t; else s.push([t, t]); }
      if (performance.now() - tick > 60) { stat(tr('{0}: measuring when each image appears, {1}%', v, Math.round(i / n * 100))); await new Promise(r => setTimeout(r)); tick = performance.now(); }
    }
    const data = { sig, step: STEP, duration: r2(D), sections: JSON.parse(JSON.stringify(w.MV.sections ? w.MV.sections() : [])), keys };
    const changed = JSON.stringify((usage[v] || {}).keys) !== JSON.stringify(keys) || JSON.stringify((usage[v] || {}).sections) !== JSON.stringify(data.sections);
    usage[v] = data;
    post(`/__usage?v=${v}`, data);
    if (changed && S.ver === v) redraw();
  } finally { f.remove(); stat(''); }
}
let probing = Promise.resolve();                          // only one version is measured at a time
// This version's appearance times: use the stored ones first; if there are none, or the storyboard has changed, measure (again)
async function needUsage(v) {
  if (v in usage) return;
  usage[v] = null;
  const r = await get(`/__usage?v=${v}`, null);
  if (!r || !r.ok) return;
  if (r.data) { usage[v] = r.data; if (S.ver === v) redraw(); }
  if (!r.data || r.data.sig !== r.sig) probing = probing.then(() => probe(v, r.sig)).catch(e => { console.warn(`could not measure when the images of ${v} appear`, e); });
}

  const cur = proj.all.includes(proj.current) ? proj.current : proj.all[0], i = proj.versions.indexOf(cur), st = history.state;
  proj.current = cur;
  Object.assign(S, { ver: cur, vb: cur, va: i > 0 ? proj.versions[i - 1] : cur });
  reg = pics;
  if (st && RENDER[st.view]) load(st); else Object.assign(S, fromHash());      // reloading, or coming back from another page: return to the same page and position; otherwise go by the # in the address bar
  if (![ALL, ...proj.all].includes(S.ver)) S.ver = cur;
  for (const id of ['va', 'vb']) if (!proj.all.includes(S[id])) S[id] = cur;
  if (S.view === 'one' && !reg.pics.some(p => p.no === S.one)) S.view = 'version';
  show(st ? st.y || 0 : 0); keep();
})();
</script>
